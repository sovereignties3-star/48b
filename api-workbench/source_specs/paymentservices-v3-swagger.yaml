    PROD:
      properties:
        BE-EnquiriesService: 'https://payment-inquiry-legacy-168554.cloudgsl.nam.nsroot.net/paymentservices/v3/inquiry'
        PaymentInitiation: 'https://payments-inbound-168554.cloudgsl.nam.nsroot.net/v3/router'
        PaymentInquiry-ECS: 'https://payment-inquiry-168554.cloudgsl.nam.nsroot.net'
        FIPayments: 'https://payments-168554.nam.nsroot.net'
        Payments: 'https://payments-inbound-168554.cloudgsl.nam.nsroot.net/v3/router'
        PaymentInitiationAkamai: 'https://payments-inbound-168554.wlb3.nam.nsroot.net/v3/router'
