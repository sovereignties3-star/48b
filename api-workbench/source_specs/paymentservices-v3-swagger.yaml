swagger: '2.0'
info:
  title: Payment Services
  description: |-
    CitiConnect API [Application Programming Interface] services allow you to access CitiDirect based payment services in a simple way with the light weight message exchange interface.<br />
    <br />
    <h3><strong>List of Payment Services under CitiConnect API</strong></h3><br />
    1. Payment Initiation<br />
    2. Payment Status Inquiry<br />
    3. Push Notifications<br />
    <br />
  version: 3.0.0
  x-ibm-name: paymentservices
basePath: /paymentservices/v3
schemes:
  - https
x-ibm-configuration:
  enforced: true
  phase: realized
  testable: true
  cors:
    enabled: true
  properties:
    FIPaymentsStops:
      value: 'https://payments-dev-168554.nam.nsroot.net'
      description: ''
      encoded: false
    PaymentInitiationAkamai:
      value: 'https://payments-inbound-168554.cloudgsl.nam.nsroot.net/v3/router'
      description: ''
      encoded: false
    Payments:
      value: 'https://payments-inbound-168554.cloudgsl.nam.nsroot.net/v3/router'
      description: ''
      encoded: false
    FIPayments:
      value: 'https://payments-168554.namicggtd12d.nam.nsroot.net'
      description: ''
      encoded: false
    PaymentInquiry-ECS:
      value: 'https://payment-inquiry-168554.namicggtd12d.nam.nsroot.net'
      description: ''
      encoded: false
    PaymentInitiation:
      value: 'https://payments-inbound-168554.cloudgsl.nam.nsroot.net/v3/router'
      description: ''
      encoded: false
    BE-EnquiriesService:
      description: ''
      encoded: false
      value: 'https://sit2citiconnectbeservices.nam.nsroot.net/citi-connect-war/services/CitiConnectInquiriesService'
  catalogs:
    UAT1:
      properties:
        BE-EnquiriesService: 'https://payment-inquiry-ms-uat-168554.namicgswd11u.nam.nsroot.net/paymentservices/v3/inquiry'
        PaymentInitiation: 'https://payments-inbound-uat-168554.nam.nsroot.net/v3/router'
        PaymentInquiry-ECS: 'https://payment-inquiry-uat-168554.namicgswd10u.nam.nsroot.net'
        FIPayments: 'https://payments-uat-168554.namicgswd10u.nam.nsroot.net'
        Payments: 'https://payments-inbound-uat-168554.nam.nsroot.net/v3/router'
        PaymentInitiationAkamai: 'https://payments-inbound-uat-168554.wlb3.nam.nsroot.net/v3/router'
        FIPaymentsStops: 'https://payments-uat-168554.nam.nsroot.net'
    SIT5:
      properties:
        BE-EnquiriesService: 'https://payment-inquiry-ms-168554.namicggtd10d.nam.nsroot.net/paymentservices/v3/inquiry'
        PaymentInitiation: 'https://payments-inbound-dev-168554.nam.nsroot.net/v3/router'
        PaymentInquiry-ECS: 'https://payment-inquiry-168554.namicggtd12d.nam.nsroot.net'
        FIPayments: 'https://payments-168554.namicggtd12d.nam.nsroot.net'
        Payments: 'https://payments-inbound-dev-168554.nam.nsroot.net/v3/router'
        PaymentInitiationAkamai: 'https://payments-inbound-dev-168554.wlb3.nam.nsroot.net/v3/router'
        FIPaymentsStops: 'https://payments-dev-168554.nam.nsroot.net'
    Sandbox:
      properties:
        BE-EnquiriesService: 'https://payment-inquiry-ms-168554.namicgswd11u.nam.nsroot.net/paymentservices/v3/inquiry'
        PaymentInitiation: 'https://payments-inbound-cte-168554.nam.nsroot.net/v3/router'
        PaymentInquiry-ECS: 'https://payment-inquiry-cte-168554.namicgswd12u.nam.nsroot.net'
        FIPayments: 'https://payments-cte-168554.namicgswd12u.nam.nsroot.net'
        Payments: 'https://payments-inbound-cte-168554.nam.nsroot.net/v3/router'
        PaymentInitiationAkamai: 'https://payments-inbound-cte-168554.wlb3.nam.nsroot.net/v3/router'
