name: Publish godmode_jocall3 to npm

on:
  push:
    branches: ["Master"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch, Filter, and Build-Validate jocall3 Repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src/packages

          # Function to process an individual repository in parallel
          process_repo() {
            repo="$1"
            echo "Evaluating jocall3/$repo..."

            # Check file count via GitHub API tree endpoint (recursive depth)
            FILE_COUNT=$(gh api "repos/jocall3/$repo/git/trees/HEAD?recursive=1" --jq '.tree | length' 2>/dev/null || echo "0")

            if [ "$FILE_COUNT" -gt 1000 ]; then
              echo "SKIP: jocall3/$repo exceeds file cap ($FILE_COUNT files > 1000)."
              exit 0
            fi

            TARGET_DIR="src/packages/$repo"

            if git clone --depth 1 "https://github.com/jocall3/$repo.com" "$TARGET_DIR" 2>/dev/null || git clone --depth 1 "https://github.com/jocall3/$repo" "$TARGET_DIR" 2>/dev/null; then
              cd "$TARGET_DIR"
              BUILD_SUCCESS=false

              if [ -f "package.json" ]; then
                if npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts 2>/dev/null; then
                  if npm run build 2>/dev/null || npm run compile 2>/dev/null || npm run prepare 2>/dev/null; then
                    BUILD_SUCCESS=true
                  fi
                fi
              elif [ -f "Makefile" ]; then
                if make 2>/dev/null; then
                  BUILD_SUCCESS=true
                fi
              else
                BUILD_SUCCESS=true
              fi

              cd - > /dev/null

              if [ "$BUILD_SUCCESS" = true ]; then
                echo "SUCCESS: jocall3/$repo ($FILE_COUNT files) passed build validation."
              else
                echo "FAIL: jocall3/$repo failed build validation. Removing directory."
                rm -rf "$TARGET_DIR"
              fi
            fi
          }

          export -f process_repo

          # Retrieve all repo names and feed them to xargs running 16 parallel processes
          gh repo list jocall3 --limit 4000 --json name -q '.[].name' | xargs -P 16 -I {} bash -c 'process_repo "{}"'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Set Package Name
        run: npm version --no-git-tag-version patch || true

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
